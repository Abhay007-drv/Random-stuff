<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Upload</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Upload Files</h1>
      <p>Any file type is welcome</p>
    </div>
    <div class="card-body">
      <div class="drop-zone" id="dropZone">
        <div class="icon">📁</div>
        <p>Drag &amp; drop files here, or <span>browse</span></p>
      </div>
      <input type="file" id="fileInput" multiple>

      <ul id="fileList"></ul>

      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

      <div class="summary" id="summary">
        <span>Estimated total</span>
        <strong id="totalCost">—</strong>
      </div>

      <button class="btn" id="uploadBtn" disabled>Upload</button>
      <button class="btn btn-next" id="nextBtn" disabled>Next</button>
      <div class="message" id="message"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
